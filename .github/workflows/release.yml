name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Attach the .vsix to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp extension/flaglens.vsix "flaglens-${version}.vsix"
          gh release create "$GITHUB_REF_NAME" "flaglens-${version}.vsix" \
            --title "FlagLens ${GITHUB_REF_NAME}" \
            --notes-file extension/CHANGELOG.md
