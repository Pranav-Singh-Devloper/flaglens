name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Lint, type-check, unit tests, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: flaglens-vsix
          path: extension/flaglens.vsix

  e2e:
    name: End-to-end against self-hosted Flagsmith
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exactly the README quick start: start self-hosted Flagsmith, seed it twice (proves the seed is idempotent).
      - run: make up
      - run: make seed
      - run: make seed
      # Flagsmith's MCP server against the same instance and key (FlagLens offers it to VS Code's AI assistants).
      - run: make mcp
      - run: make mcp-check
      - name: Demo shop serves flags from Flagsmith
        run: |
          node examples/demo-shop/server.mjs &
          for i in $(seq 1 20); do curl -fs http://localhost:3030/ > page.html && break; sleep 1; done
          grep -q "dev build" page.html
          grep -q "One-page checkout" page.html
      # FlagLens in CI: the demo shop deliberately has a typo, an archived flag in use and two rule mistakes, so this
      # report always has something to show. Not --strict, for that reason. On pull requests it is also a comment.
      - name: FlagLens check (job summary, and a PR comment on pull requests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node extension/scripts/check.mjs --path examples/demo-shop ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && '--comment' || '' }}
      - name: Extension tests in a real VS Code
        run: xvfb-run -a npm run test:integration -w extension
      - if: failure()
        run: docker compose -f devkit/compose.yaml logs --tail 200 flagsmith
